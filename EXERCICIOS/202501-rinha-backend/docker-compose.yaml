name: payment

x-service-templates:
  api: &api
    networks:
      - backend
      - payment-processor
    build: .
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis

services:
  redis:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    networks:
      - backend
  api1:
    <<: *api
  api2:
    <<: *api
  nginx:
    image: nginx:alpine@sha256:72aeb3308ef6cb3118242fb16389518923916dfa206e32d1a8377acc328b9870
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9999:9999"
    depends_on:
      - api1
      - api2
    networks:
      - backend
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
networks:
  backend:
    driver: bridge
  payment-processor:
    external: true
