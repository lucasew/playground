name: payment

x-service-templates:
  api: &api
    networks:
      - backend
      - payment-processor
    build: .
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis

services:
  redis:
    image: redis:8-alpine@sha256:0bf6577d7774e592b29d093e3ac9390eb91e13d72c21e506afce736de5e0eeb0
    networks:
      - backend
  api1:
    <<: *api
  api2:
    <<: *api
  nginx:
    image: nginx:alpine@sha256:a3554c0d0b48177b1413c26e01f695334428020d9df01243fbae3e11cfd17417
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9999:9999"
    depends_on:
      - api1
      - api2
    networks:
      - backend
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
networks:
  backend:
    driver: bridge
  payment-processor:
    external: true
