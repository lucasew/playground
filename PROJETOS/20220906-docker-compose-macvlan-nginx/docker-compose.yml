version: "3.9"
services:
  httpd:
    image: nginx@sha256:332d0beea97cff8c0d5d27976c0778a4b00345b9d74c2feaaf8efde548314948
    ports:
      - "80:80"
    networks:
      http-vlan:
        ipv4_address: 192.168.1.20
networks:
  http-vlan:
    driver: macvlan
    driver_opts:
      parent: enp2s0f1
    ipam:
      driver: default
      config:
        - subnet: 192.168.1.0/24
          gateway: 192.168.1.1

