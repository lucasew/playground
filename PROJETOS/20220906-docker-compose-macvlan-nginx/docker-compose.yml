version: "3.9"
services:
  httpd:
    image: nginx@sha256:4c41e2d0a3a55b325ed572cd0200bdb72af1433c3daa2bca6ef8eea68ce504a2
    ports:
      - "80:80"
    networks:
      http-vlan:
        ipv4_address: 192.168.1.20
networks:
  http-vlan:
    driver: macvlan
    driver_opts:
      parent: enp2s0f1
    ipam:
      driver: default
      config:
        - subnet: 192.168.1.0/24
          gateway: 192.168.1.1

